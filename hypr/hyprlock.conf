# Skemos — hyprlock. Solid paper field with schematic corner brackets,
# mirroring hypr/shaders/skemos.frag. No blur.
#
# NOTE: hyprlock `shape` renders borders as a larger filled rect, not a hollow
# outline (hyprwm/hyprlock#458) — so the HUD here is built from small SOLID
# rectangles (bracket arms), never a bordered frame.

general {
    hide_cursor        = true
    ignore_empty_input = true
    text_trim          = true
}

background {
    monitor     =
    color       = rgb(161513)
    blur_passes = 0
    blur_size   = 0
}

# ---- corner brackets: two solid arms per corner, 46x2 / 2x46, 62px inset ----
shape {
    monitor  =
    size     = 46, 2
    color    = rgb(9a948a)
    rounding = 0
    position = 62, 62
    halign   = left
    valign   = top
}
shape {
    monitor  =
    size     = 2, 46
    color    = rgb(9a948a)
    rounding = 0
    position = 62, 62
    halign   = left
    valign   = top
}
shape {
    monitor  =
    size     = 46, 2
    color    = rgb(9a948a)
    rounding = 0
    position = 62, 62
    halign   = right
    valign   = top
}
shape {
    monitor  =
    size     = 2, 46
    color    = rgb(9a948a)
    rounding = 0
    position = 62, 62
    halign   = right
    valign   = top
}
shape {
    monitor  =
    size     = 46, 2
    color    = rgb(9a948a)
    rounding = 0
    position = 62, 62
    halign   = left
    valign   = bottom
}
shape {
    monitor  =
    size     = 2, 46
    color    = rgb(9a948a)
    rounding = 0
    position = 62, 62
    halign   = left
    valign   = bottom
}
shape {
    monitor  =
    size     = 46, 2
    color    = rgb(9a948a)
    rounding = 0
    position = 62, 62
    halign   = right
    valign   = bottom
}
shape {
    monitor  =
    size     = 2, 46
    color    = rgb(9a948a)
    rounding = 0
    position = 62, 62
    halign   = right
    valign   = bottom
}

# accent tick off the top-left bracket
shape {
    monitor  =
    size     = 12, 2
    color    = rgb(c1663a)
    rounding = 0
    position = 118, 62
    halign   = left
    valign   = top
}

# ---- readouts --------------------------------------------------------------
# drawing tag, top-left
label {
    monitor     =
    text        = N V — 0 1
    color       = rgb(55514a)
    font_size   = 11
    font_family = Iosevka
    position    = 90, 98
    halign      = left
    valign      = top
}

# clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(e5e1d6)
    font_size   = 44
    font_family = Iosevka
    position    = 0, 64
    halign      = center
    valign      = center
}

# date
label {
    monitor     =
    text        = cmd[update:60000] date +"%Y-%m-%d"
    color       = rgb(9a948a)
    font_size   = 12
    font_family = Iosevka
    position    = 0, 22
    halign      = center
    valign      = center
}

input-field {
    monitor           =
    size              = 260, 44
    outline_thickness = 1
    rounding          = 0
    dots_size         = 0.24
    dots_spacing      = 0.32
    dots_center       = true
    outer_color       = rgb(34322d)
    inner_color       = rgb(1e1d19)
    font_color        = rgb(e5e1d6)
    check_color       = rgb(c1663a)
    fail_color        = rgb(c1663a)
    fade_on_empty     = false
    placeholder_text  = <span foreground="##9a948a">locked</span>
    fail_text         = <span foreground="##c1663a">$FAIL ($ATTEMPTS)</span>
    position          = 0, -24
    halign            = center
    valign            = center
}

# corner tag — quiet schematic detail
label {
    monitor     =
    text        = N I G H T   V E L L U M
    color       = rgb(55514a)
    font_size   = 10
    font_family = Iosevka
    position    = 0, 28
    halign      = center
    valign      = bottom
}
