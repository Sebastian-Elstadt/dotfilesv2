# Night Vellum — hyprlock. Dark + off-white, no blur. Solid paper field.

general {
    hide_cursor        = true
    ignore_empty_input = true
    text_trim          = true
}

background {
    monitor     =
    color       = rgb(161513)
    blur_passes = 0
    blur_size   = 0
}

# clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(e5e1d6)
    font_size   = 44
    font_family = Iosevka
    position    = 0, 64
    halign      = center
    valign      = center
}

# date
label {
    monitor     =
    text        = cmd[update:60000] date +"%Y-%m-%d"
    color       = rgb(9a948a)
    font_size   = 12
    font_family = Iosevka
    position    = 0, 22
    halign      = center
    valign      = center
}

input-field {
    monitor          =
    size             = 260, 44
    outline_thickness = 1
    rounding         = 0
    dots_size        = 0.24
    dots_spacing     = 0.32
    dots_center      = true
    outer_color      = rgb(34322d)
    inner_color      = rgb(1e1d19)
    font_color       = rgb(e5e1d6)
    check_color      = rgb(c1663a)
    fail_color       = rgb(c1663a)
    fade_on_empty    = false
    placeholder_text = <span foreground="##9a948a">locked</span>
    fail_text        = <span foreground="##c1663a">$FAIL ($ATTEMPTS)</span>
    position         = 0, -24
    halign           = center
    valign           = center
}

# corner tag — quiet schematic detail
label {
    monitor     =
    text        = N I G H T   V E L L U M
    color       = rgb(55514a)
    font_size   = 10
    font_family = Iosevka
    position    = 0, 28
    halign      = center
    valign      = bottom
}
