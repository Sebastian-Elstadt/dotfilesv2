# Skemos — hyprlock. Solid paper field + schematic corner brackets, mirroring
# hypr/shaders/skemos.frag / the wallpaper.
#
# hyprlock `shape` borders render as a larger filled rect, not a hollow outline
# (hyprwm/hyprlock#458), and per-edge halign/valign offsets are inconsistent
# (#516, #744). So every bracket arm is a small SOLID rect, anchored
# halign=center / valign=center with a hardcoded offset from the 2560x1440
# centre (+x right, +y up). Update the offsets if the panel size changes.

general {
    hide_cursor        = true
    ignore_empty_input = true
    text_trim          = true
}

background {
    monitor     =
    color       = rgb(161513)
    blur_passes = 0
    blur_size   = 0
}

# ---- corner brackets -------------------------------------------------------
# Two solid arms per corner (horizontal 46x2, vertical 2x46); the corner point
# sits 60px in from each screen edge.

# top-left
shape {
    monitor  =
    size     = 46, 2
    color    = rgb(9a948a)
    rounding = 0
    halign   = center
    valign   = center
    position = -1197, 660
}
shape {
    monitor  =
    size     = 2, 46
    color    = rgb(9a948a)
    rounding = 0
    halign   = center
    valign   = center
    position = -1220, 637
}

# top-right
shape {
    monitor  =
    size     = 46, 2
    color    = rgb(9a948a)
    rounding = 0
    halign   = center
    valign   = center
    position = 1197, 660
}
shape {
    monitor  =
    size     = 2, 46
    color    = rgb(9a948a)
    rounding = 0
    halign   = center
    valign   = center
    position = 1220, 637
}

# bottom-left
shape {
    monitor  =
    size     = 46, 2
    color    = rgb(9a948a)
    rounding = 0
    halign   = center
    valign   = center
    position = -1197, -660
}
shape {
    monitor  =
    size     = 2, 46
    color    = rgb(9a948a)
    rounding = 0
    halign   = center
    valign   = center
    position = -1220, -637
}

# bottom-right
shape {
    monitor  =
    size     = 46, 2
    color    = rgb(9a948a)
    rounding = 0
    halign   = center
    valign   = center
    position = 1197, -660
}
shape {
    monitor  =
    size     = 2, 46
    color    = rgb(9a948a)
    rounding = 0
    halign   = center
    valign   = center
    position = 1220, -637
}

# accent tick off the top-left bracket's horizontal arm
shape {
    monitor  =
    size     = 12, 2
    color    = rgb(c1663a)
    rounding = 0
    halign   = center
    valign   = center
    position = -1162, 660
}

# ---- readouts ------------------------------------------------------------
# drawing tag, tucked under the top-left bracket
label {
    monitor     =
    text        = S K — 0 1
    color       = rgb(55514a)
    font_size   = 11
    font_family = Iosevka
    position    = -1172, 612
    halign      = center
    valign      = center
}

# clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(e5e1d6)
    font_size   = 44
    font_family = Iosevka
    position    = 0, 64
    halign      = center
    valign      = center
}

# date
label {
    monitor     =
    text        = cmd[update:60000] date +"%Y-%m-%d"
    color       = rgb(9a948a)
    font_size   = 12
    font_family = Iosevka
    position    = 0, 22
    halign      = center
    valign      = center
}

input-field {
    monitor           =
    size              = 260, 44
    outline_thickness = 1
    rounding          = 0
    dots_size         = 0.24
    dots_spacing      = 0.32
    dots_center       = true
    outer_color       = rgb(34322d)
    inner_color       = rgb(1e1d19)
    font_color        = rgb(e5e1d6)
    check_color       = rgb(c1663a)
    fail_color        = rgb(c1663a)
    fade_on_empty     = false
    placeholder_text  = <span foreground="##9a948a">locked</span>
    fail_text         = <span foreground="##c1663a">$FAIL ($ATTEMPTS)</span>
    position          = 0, -24
    halign            = center
    valign            = center
}

# corner tag — quiet schematic detail
label {
    monitor     =
    text        = S K E M O S
    color       = rgb(55514a)
    font_size   = 10
    font_family = Iosevka
    position    = 0, 28
    halign      = center
    valign      = bottom
}
