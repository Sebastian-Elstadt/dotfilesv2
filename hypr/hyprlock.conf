# Night Vellum — hyprlock. Same palette. No blur soup: solid paper field.

general {
    hide_cursor        = true
    ignore_empty_input = true
    text_trim          = true
}

background {
    monitor     =
    color       = rgb(161513)
    blur_passes = 0
    blur_size   = 0
}

# clock
label {
    monitor     =
    text        = cmd[update:1000] date +"%H:%M"
    color       = rgb(c4bfb3)
    font_size   = 44
    font_family = Iosevka
    position    = 0, 64
    halign      = center
    valign      = center
}

# date
label {
    monitor     =
    text        = cmd[update:60000] date +"%Y-%m-%d"
    color       = rgb(8a857c)
    font_size   = 12
    font_family = Iosevka
    position    = 0, 22
    halign      = center
    valign      = center
}

input-field {
    monitor          =
    size             = 260, 44
    outline_thickness = 1
    rounding         = 0
    dots_size        = 0.24
    dots_spacing     = 0.32
    dots_center      = true
    outer_color      = rgb(3a3934)
    inner_color      = rgb(1c1b18)
    font_color       = rgb(c4bfb3)
    check_color      = rgb(6a8494)
    fail_color       = rgb(a67c52)
    fade_on_empty    = false
    placeholder_text = <span foreground="##8a857c">locked</span>
    fail_text        = <span foreground="##a67c52">$FAIL ($ATTEMPTS)</span>
    position         = 0, -24
    halign           = center
    valign           = center
}

# corner tag — quiet HUD detail
label {
    monitor     =
    text        = N I G H T   V E L L U M
    color       = rgb(3a3934)
    font_size   = 10
    font_family = Iosevka
    position    = 0, 28
    halign      = center
    valign      = bottom
}
