# Night Vellum — hypridle. Conservative VM timeouts. Lock -> screen off.

general {
    lock_cmd         = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# METAL: dim the backlight first (no-op in the VM — no backlight device).
listener {
    timeout   = 240
    on-timeout = brightnessctl -s set 10% 2>/dev/null; true
    on-resume  = brightnessctl -r 2>/dev/null; true
}

# lock
listener {
    timeout   = 360
    on-timeout = loginctl lock-session
}

# screen off
listener {
    timeout   = 480
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

