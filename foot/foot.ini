# Skemos — foot (>= 1.28 schema). Dark + warm off-white, reversed
# technical drawing. Near-monochrome; one accent = burnt drafting orange.

[main]
font=Iosevka:size=11
line-height=15
pad=10x10 center
dpi-aware=no
bold-text-in-bright=no
initial-color-theme=dark

[cursor]
style=block
blink=no

[scrollback]
lines=10000

[colors-dark]
alpha=1.0
background=161513
foreground=e5e1d6
cursor=161513 e5e1d6

# selection: white block, ink-black text (e-ink highlight)
selection-foreground=161513
selection-background=e5e1d6
urls=c1663a

# 16-colour palette: collapsed toward ink. Orange fills the red/yellow slots;
# everything else is a shade of paper-white.
regular0=1e1d19
regular1=c1663a
regular2=9a948a
regular3=c1663a
regular4=9a948a
regular5=9a948a
regular6=b8b3a6
regular7=e5e1d6
bright0=55514a
bright1=d1774a
bright2=b8b3a6
bright3=d1774a
bright4=b8b3a6
bright5=b8b3a6
bright6=e5e1d6
bright7=f2eee3
