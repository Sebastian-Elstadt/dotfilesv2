# Night Vellum — foot (>= 1.28 schema: [colors-dark]).
# Dark e-ink paper; near-monochrome with blueprint + one warm accent.

[main]
font=Iosevka:size=11
line-height=15
pad=10x10 center
dpi-aware=no
bold-text-in-bright=no
initial-color-theme=dark

[cursor]
style=beam
blink=no

[scrollback]
lines=10000

[colors-dark]
alpha=1.0
background=161513
foreground=c4bfb3
cursor=161513 c4bfb3

selection-foreground=161513
selection-background=6a8494
urls=6a8494

# 16-color palette: desaturated toward ink; blueprint is the only "colour",
# alert (a67c52) fills the red / error slots.
regular0=1c1b18
regular1=a67c52
regular2=6a8494
regular3=8a857c
regular4=6a8494
regular5=8a857c
regular6=6a8494
regular7=c4bfb3
bright0=3a3934
bright1=a67c52
bright2=6a8494
bright3=c4bfb3
bright4=6a8494
bright5=c4bfb3
bright6=6a8494
bright7=c4bfb3
