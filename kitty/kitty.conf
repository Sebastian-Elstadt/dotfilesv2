# Night Vellum — Kitty. COMPLETE config, prepared for the bare-metal machine.
# NOT the active terminal on the VM (foot is). To switch: set
#   local terminal = "kitty"
# in ~/.config/hypr/binds.lua and reload Hyprland.

font_family        Iosevka
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          11.0
modify_font        cell_height 130%
disable_ligatures  never

cursor_shape            beam
cursor_blink_interval   0
pointer_shape_when_dragging beam

scrollback_lines        10000
wheel_scroll_multiplier 3.0

enable_audio_bell    no
window_alert_on_bell no
visual_bell_duration 0

window_padding_width      10
hide_window_decorations   yes
confirm_os_window_close   0
background_opacity         1.0

tab_bar_edge        top
tab_bar_style       separator
tab_separator       " │ "
tab_title_template  "{index}:{title}"

# Wayland
linux_display_server wayland

include night-vellum.conf
